name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Test without default features
        run: cargo test --no-default-features

      - name: Check standalone CLI features
        run: cargo clippy --all-targets --no-default-features --features cli -- -D warnings

      - name: Test server without default features
        run: cargo test --no-default-features --features server

      - name: Build documentation
        run: cargo doc --no-deps --all-features

      - name: Verify the crate packages standalone
        run: cargo publish --dry-run

  container:
    name: Container Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: starfield-datastore:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Test the built image
        run: bash tests/container.sh starfield-datastore:ci
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag starfield-datastore:ci "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          # Every push gets its immutable tag; an older run cannot move latest back.
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            docker tag starfield-datastore:ci "$image:main"
            docker tag starfield-datastore:ci "$image:latest"
            docker push "$image:main"
            docker push "$image:latest"
          fi
          echo "Published \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
