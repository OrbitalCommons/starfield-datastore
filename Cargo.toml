[package]
name = "starfield-datastore"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Pull-through artifact cache with fail-closed validation, an S3 mirror served by presigned redirect, and a credential model that keeps upstream secrets in one place"
repository = "https://github.com/OrbitalCommons/starfield-datastore"
readme = "README.md"
keywords = ["cache", "artifacts", "s3", "mirror", "astronomy"]
categories = ["caching", "filesystem"]

[[bin]]
name = "starfield-datastore"
path = "src/bin/starfield-datastore.rs"
required-features = ["cli"]

[dependencies]
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
url = "2"
zeroize = "1"
indicatif = { version = "0.18", optional = true }
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"], optional = true }
aws-sdk-s3 = { version = "1.146.0", default-features = false, features = ["rt-tokio", "default-https-client", "rustls"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "io-util", "macros"], optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
axum = { version = "0.8.9", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-smithy-types = { version = "1.6.3", optional = true }

[features]
default = ["mirror-http", "progress"]
mirror-http = []
mirror-s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types", "dep:aws-smithy-types", "dep:tokio"]
onepassword = []
progress = ["dep:indicatif"]
cli = ["dep:clap"]
server = ["cli", "mirror-s3", "dep:axum"]
