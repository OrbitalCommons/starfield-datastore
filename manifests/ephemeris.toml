# The SPICE kernels starfield needs (spec §15, step 5). Keys are archive-shaped
# and stable; sources are where the bytes live today. `sha256` pins are written
# back by `starfield-datastore mirror` once each artifact has been mirrored.
#
# Checks reject the wrong kind of thing (an HTML page under a .bsp key); the
# kernel parser validates the format. DAF ID words sit at bytes 0..8, so the
# binary checks do not trim; text kernels may open with blank lines, so those
# do. `NAIF/DAF` is the pre-N0052 ID word still found in archived kernels.

[[artifact]]
key = "naif/spk/de421.bsp"
sources = [
    "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/a_old_versions/de421.bsp",
    "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de421.bsp",
]
bytes = 16790528
freshness = "immutable"
check = { magic = ["DAF/SPK", "NAIF/DAF"], trim_leading_whitespace = false }
description = "JPL DE421 planetary and lunar ephemeris, 1900-2050 (NAIF generic kernels)"
license = "public-domain"
citation = "Folkner, W. M., Williams, J. G., Boggs, D. H. (2009). The Planetary and Lunar Ephemeris DE 421. IPN Progress Report 42-178."

